services:
  postgres:
    image: postgres:16-alpine
    container_name: vcrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: vcrm
    ports:
      - '5432:5432'
    volumes:
      - ./infra/docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vcrm']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vcrm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: vcrm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: vcrm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/vcrm-dev;
      mc anonymous set download myminio/vcrm-dev;
      exit 0;
      "

  opensearch:
    build:
      context: ./infra/docker/opensearch
      dockerfile: Dockerfile
    container_name: vcrm-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - '9200:9200'
      - '9600:9600'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: vcrm-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./infra/keycloak/vcrm-realm.json:/opt/keycloak/data/import/vcrm-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/8080 || curl -f http://localhost:8080/health/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: vcrm-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 1025 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5

  mock-3cx:
    build:
      context: ./infra/mock-3cx
      dockerfile: Dockerfile
    container_name: vcrm-mock-3cx
    restart: unless-stopped
    ports:
      - '5001:5001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:5001/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5

  mock-ai:
    build:
      context: ./infra/mock-ai
      dockerfile: Dockerfile
    container_name: vcrm-mock-ai
    restart: unless-stopped
    ports:
      - '5002:5002'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:5002/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  minio-data:
  opensearch-data:
  keycloak-data:
